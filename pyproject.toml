[project]
name = "cmpe260-wiki-agent"
version = "0.1.0"
description = "Wiki Game agent project using the Wikispeedia dataset"
requires-python = ">=3.11"
dependencies = [
    "gymnasium>=1.0,<2",
    "numpy>=1.26",
    "torch>=2.4",
    "tqdm>=4.70.1",
    "transformers>=4.56,<6",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "tokenizers>=0.21,<1",
]

[tool.pytest.ini_options]
testpaths = ["test"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: loads pretrained Qwen weights; run explicitly with -m integration",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu130", marker = "sys_platform == 'win32'" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
